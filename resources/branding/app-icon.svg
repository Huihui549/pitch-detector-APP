<?xml version="1.0" encoding="UTF-8"?>
<!--
  应用桌面图标（源文件，512×512）

  风格：D（仪表/DAW 深色高对比）——近黑底 + 单一青绿强调色 + 一条"音高曲线"。
  语义：左侧低、右侧高的波形 + 一个亮点（当前音高），一眼看出"这是个测音高的工具"。
  颜色在此**允许硬编码**：它是品牌资产（不随界面主题切换），只有界面令牌才受
  tools/check-theme.ps1 约束。生成各密度 PNG 见 tools/gen-app-icons.ps1。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141C26"/>
      <stop offset="1" stop-color="#080B10"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B7F6F"/>
      <stop offset="0.55" stop-color="#2ED3B7"/>
      <stop offset="1" stop-color="#7BF0DA"/>
    </linearGradient>
  </defs>

  <!-- 圆角底 -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="103.5" fill="none"
        stroke="#26303C" stroke-width="1"/>

  <!-- 基准线（像调音器的刻度底） -->
  <line x1="72" y1="330" x2="440" y2="330" stroke="#26303C" stroke-width="6" stroke-linecap="round"/>

  <!-- 刻度短线 -->
  <g stroke="#3A4757" stroke-width="5" stroke-linecap="round">
    <line x1="104" y1="330" x2="104" y2="352"/>
    <line x1="168" y1="330" x2="168" y2="344"/>
    <line x1="232" y1="330" x2="232" y2="352"/>
    <line x1="296" y1="330" x2="296" y2="344"/>
    <line x1="360" y1="330" x2="360" y2="352"/>
    <line x1="424" y1="330" x2="424" y2="344"/>
  </g>

  <!-- 音高曲线：低 → 高，末段陡起 -->
  <path d="M72 268 C 132 268, 152 196, 208 196
           C 264 196, 280 292, 336 292
           C 372 292, 388 150, 440 118"
        fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round"/>

  <!-- 当前音高点 -->
  <circle cx="440" cy="118" r="30" fill="#2ED3B7" opacity="0.22"/>
  <circle cx="440" cy="118" r="16" fill="#7BF0DA"/>
</svg>
